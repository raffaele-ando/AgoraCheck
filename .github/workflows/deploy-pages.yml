name: Deploy to GitHub Pages

# Build the Vite SPA and publish it to GitHub Pages for quick testing.
# One-time setup by the repo owner: Settings -> Pages -> Build and deployment
# -> Source: "GitHub Actions".
#
# Notes:
#  - Firebase web config ships as a public fallback in src/firebase.ts, so no
#    secrets are required for the site to connect. You may still override with
#    repository secrets VITE_FIREBASE_* if you prefer.
#  - Server routes (/api/*, /id cookie) do NOT exist on Pages; the app degrades
#    to client-only persistence there. Use Cloud Run for the full backend.

on:
  push:
    branches:
      - claude/algorithm-analysis-improvements-llcj8b
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (GitHub Pages base)
        env:
          VITE_BASE: /AgoraCheck/
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
        run: |
          npx vite build
          # SPA deep-link fallback for GitHub Pages
          cp dist/index.html dist/404.html
          # Prevent Jekyll from touching the build
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
