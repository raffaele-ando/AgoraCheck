name: Deploy to GitHub Pages

# Build the Vite SPA and publish it to GitHub Pages for quick testing.
# One-time setup by the repo owner: Settings -> Pages -> Build and deployment
# -> Source: "GitHub Actions".
#
# Notes:
#  - Firebase web config ships as a public fallback in src/firebase.ts, so no
#    secrets are required for the site to connect. You may still override with
#    repository secrets VITE_FIREBASE_* if you prefer.
#  - Server routes (/api/*, /id cookie) do NOT exist on Pages; the app degrades
#    to client-only persistence there. Use Cloud Run for the full backend.

# Si pubblica SOLO da main, e non è una preferenza: l'ambiente "github-pages"
# ha una regola di protezione che accetta il solo ramo predefinito, quindi da
# un ramo di lavoro il passo "build" riesce e il passo "deploy" fallisce dopo
# un secondo. Tenere i rami di lavoro nell'elenco faceva anche un danno
# peggiore del rumore: la concorrenza qui sotto usa cancel-in-progress sul
# gruppo "pages", perciò un push su un ramo secondario ANNULLAVA un rilascio
# di main già in corso per poi fallire da solo — e il sito restava alla
# versione precedente senza che nulla lo segnalasse.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build (dominio proprio: agora.theproject.world)
        # Niente VITE_BASE: il default in vite.config.ts è '/', giusto per un
        # sito che vive alla radice di un dominio — non più sotto
        # github.io/AgoraCheck/. Il file public/CNAME (copiato tale e quale in
        # dist/) dice a GitHub Pages quale dominio personalizzato servire.
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
          # Stesso dominio, non un segreto: senza questa il sito continuerebbe
          # a caricare i media con la vecchia via (GitHub / dataURL in
          # Firestore) invece di passare dal Worker su R2. Vedi cloudflare/README.md.
          VITE_MEDIA_UPLOAD_URL: https://agora.theproject.world/media
        run: |
          npx vite build
          # SPA deep-link fallback for GitHub Pages
          cp dist/index.html dist/404.html
          # Prevent Jekyll from touching the build
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
