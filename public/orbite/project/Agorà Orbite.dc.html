<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.stageRef = React.createRef();
    this.scaleRef = React.createRef();
    this.orbits = [
      { rx: 410, ry: 210, tilt: -12, dur: 46 },
      { rx: 540, ry: 285, tilt: -12, dur: 66, rev: true },
      { rx: 720, ry: 370, tilt: -12, dur: 88 },
      { rx: 900, ry: 455, tilt: -12, dur: 112, rev: true }
    ];
  }

  renderVals() {
    return { stageRef: this.stageRef, scaleRef: this.scaleRef };
  }

  componentDidMount() {
    const root = this.stageRef.current;
    if (!root) return;
    this.tokens = Array.from(root.querySelectorAll("[data-token]"));
    this.rings = Array.from(root.querySelectorAll("[data-ring]"));
    const perOrbit = {};
    this.tokens.forEach(el => { const o = +el.dataset.orbit; perOrbit[o] = (perOrbit[o] || 0) + 1; });
    this.meta = new Map();
    const seen = {};
    this.tokens.forEach(el => {
      const o = +el.dataset.orbit;
      seen[o] = seen[o] || 0;
      this.meta.set(el, { o, phase: (seen[o] / perOrbit[o]) * Math.PI * 2 });
      seen[o]++;
      el.style.willChange = "transform";
      el.style.contain = "layout paint";
    });
    this.resize = () => {
      const s = Math.min(1, root.clientWidth / 2110, root.clientHeight / 1080);
      if (this.scaleRef.current) this.scaleRef.current.style.transform = "scale(" + s.toFixed(3) + ")";
    };
    this.resize();
    window.addEventListener("resize", this.resize);
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const t0 = performance.now();
    let last = -999;
    const frame = (now) => {
      this.raf = requestAnimationFrame(frame);
      if (now - last < 33) return;
      last = now;
      const t = reduce ? 0 : (now - t0) / 1000;
      const breathe = 1 + 0.04 * Math.sin(t / 7);
      this.orbits.forEach((orb, i) => {
        const ring = this.rings[i];
        if (ring) ring.style.transform = "rotate(" + orb.tilt + "deg) scale(" + breathe.toFixed(4) + ")";
      });
      this.tokens.forEach(el => {
        const m = this.meta.get(el);
        const orb = this.orbits[m.o];
        const a = m.phase + (orb.rev ? -1 : 1) * (t / orb.dur) * Math.PI * 2;
        const x0 = Math.cos(a) * orb.rx * breathe;
        const y0 = Math.sin(a) * orb.ry * breathe;
        const r = orb.tilt * Math.PI / 180;
        const x = x0 * Math.cos(r) - y0 * Math.sin(r);
        const y = x0 * Math.sin(r) + y0 * Math.cos(r);
        const depth = Math.sin(a);
        const sc = 0.88 + 0.14 * (depth + 1) / 2;
        el.style.transform = "translate(-50%,-50%) translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) scale(" + sc.toFixed(3) + ")";
        el.style.opacity = (0.55 + 0.45 * (depth + 1) / 2).toFixed(2);
      });
    };
    this.raf = requestAnimationFrame(frame);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    window.removeEventListener("resize", this.resize);
  }
}
</script>
