<!DOCTYPE html>
<html lang="it">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agorà</title>
<meta name="description" content="Agorà — la rete degli atenei italiani.">
<meta name="theme-color" content="#F4F1EA">

<link rel="preload" as="image" href="assets/img/agora-logo.png" fetchpriority="high">
<link rel="preconnect" href="https://commons.wikimedia.org" crossorigin>
<link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
<script>
/* Il velo d'apertura esiste solo se c'è JavaScript e il movimento è consentito:
   senza JS la pagina resta accessibile e non c'è nulla da chiudere.

   Questo blocco gira prima che il corpo sia disegnato, e deve farlo: il velo lo
   mette in pagina il selettore, che è differito, quindi per un centinaio di
   millisecondi la pagina esisterebbe senza niente sopra e si vedrebbe il
   fallback — loghi e bandiere incolonnati. Il fondo d'attesa (.ground) copre lo
   schermo dal primo disegno; il selettore lo toglie appena il velo ha
   disegnato il suo primo fotogramma. Serve anche il nome del design scelto,
   perché il primo ha il fondo scuro e gli altri crema: il colore sbagliato
   sarebbe un lampo di crema prima del nero. */
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  var radice = document.documentElement;
  radice.className += ' has-portal';
  var scelta = null;
  try { scelta = localStorage.getItem('agora:apertura'); } catch (e) {}
  radice.setAttribute('data-apertura', scelta || 'tunnel-archi');
  /* Rete di sicurezza: se il selettore non arriva — script bloccato, errore —
     il fondo d'attesa non deve restare a coprire la pagina per sempre. */
  setTimeout(function () {
    var g = document.querySelector('.ground');
    if (g && g.parentNode) g.parentNode.removeChild(g);
  }, 8000);
}
/* Registro dei design d'apertura: i file in assets/js/aperture/ si iscrivono
   qui, il selettore in assets/js/intro.js ne avvia uno. */
window.AgoraAperture = { items: {}, register: function (id, fn) { this.items[id] = fn; } };
</script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- Fondo d'attesa: copre la pagina dal primo disegno fino al primo fotogramma
     dell'apertura. Senza JavaScript non compare affatto. -->
<div class="ground" aria-hidden="true"></div>

<!-- I quattro design d'apertura. Ogni template è il markup del velo così
     com'era al proprio commit; il selettore ne clona uno e avvia lo script
     omonimo in assets/js/aperture/. -->
<!-- «Marchio» — markup del velo al commit 271f3f4, riportato senza modifiche -->
<template data-aperture="marchio">
<!-- Apertura: la porta del brandmark si allarga e scopre il sito -->
<div class="portal" id="portal" aria-hidden="true">
  <svg class="portal__svg" id="portal-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path class="portal__veil" id="portal-veil" fill="#111111" fill-rule="evenodd"></path>
    <!-- Tappo: tiene chiuso il vano finché la porta non inizia ad aprirsi,
         così durante la posa il marchio si legge come nel logo. Il contorno
         dello stesso colore copre la cucitura col bordo del velo. -->
    <path class="portal__plug" id="portal-plug" fill="#111111" stroke="#111111" stroke-width="2"></path>
    <g id="portal-bars" fill="#F4F1EA">
      <path class="portal__bar" opacity="0"></path>
      <path class="portal__bar" opacity="0"></path>
      <path class="portal__bar" opacity="0"></path>
      <path class="portal__bar" opacity="0"></path>
      <path class="portal__bar" opacity="0"></path>
    </g>
  </svg>
</div>
</template>

<!-- «Sequenza» — markup del velo al commit c37e886, riportato senza modifiche -->
<template data-aperture="sequenza">
<!-- Apertura: le porte del brandmark sfilano una dopo l'altra e scoprono il sito -->
<div class="portal" id="portal" aria-hidden="true">
  <svg class="portal__svg" id="portal-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
    <defs>
      <!-- Lo stesso fondo della scena: il bordo della finestra non si vede
           come un salto di tono, resta visibile solo il nero delle porte. -->
      <radialGradient id="portal-bg" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1">
        <stop offset="0" stop-color="#F4F1EA"/>
        <stop offset="1" stop-color="#EAE0D0"/>
      </radialGradient>
    </defs>
    <path class="portal__veil" id="portal-veil" fill="url(#portal-bg)" fill-rule="evenodd"></path>
    <g id="portal-bars" fill="#111111">
      <path class="portal__bar"></path>
      <path class="portal__bar"></path>
      <path class="portal__bar"></path>
      <path class="portal__bar"></path>
      <path class="portal__bar"></path>
    </g>
  </svg>
</div>
</template>

<!-- «Tunnel · una porta» — markup del velo al commit 8d11425, riportato senza modifiche -->
<template data-aperture="tunnel-unico">
<!-- Apertura: le porte del brandmark sfilano una dopo l'altra e scoprono il sito -->
<div class="portal" id="portal" aria-hidden="true">
  <svg class="portal__svg" id="portal-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
    <defs>
      <!-- Lo stesso fondo della scena: il bordo della finestra non si vede
           come un salto di tono, resta visibile solo il nero delle porte. -->
      <radialGradient id="portal-bg" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1">
        <stop offset="0" stop-color="#F4F1EA"/>
        <stop offset="1" stop-color="#EAE0D0"/>
      </radialGradient>
    </defs>
    <path class="portal__veil" id="portal-veil" fill="url(#portal-bg)" fill-rule="evenodd"></path>
    <g id="portal-bars" fill="#111111">
      <path class="portal__bar"></path>
      <path class="portal__bar"></path>
      <path class="portal__bar"></path>
      <path class="portal__bar"></path>
      <path class="portal__bar"></path>
    </g>
  </svg>
</div>
</template>

<!-- «Tunnel · cinque archi» — markup del velo al commit 77bcd1d, riportato senza modifiche -->
<template data-aperture="tunnel-archi">
<!-- Apertura: un tunnel fatto dai cinque archi del marchio -->
<div class="portal" id="portal" aria-hidden="true">
  <svg class="portal__svg" id="portal-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
    <defs>
      <!-- Il velo. Il colore riprende la sfumatura dello sfondo della scena, così
           non si legge come un salto di tono: resta visibile solo il nero delle
           porte. La trasparenza sta negli stop centrali, spostati da JS: seguono
           il vano della porta più lontana, cioè il fondo del tunnel. Il bordo è
           sfumato, così il taglio dei contenuti non si vede. Niente maschera
           SVG: costa un ridisegno a schermo intero per fotogramma. -->
      <radialGradient id="portal-bg" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1">
        <stop offset="0" stop-color="#F4F1EA" stop-opacity="0"/>
        <stop offset="0" stop-color="#F4F1EA" stop-opacity="0"/>
        <stop offset="0" stop-color="#F4F1EA" stop-opacity="1"/>
        <stop offset="1" stop-color="#EAE0D0" stop-opacity="1"/>
      </radialGradient>
    </defs>
    <rect class="portal__veil" x="0" y="0" width="100%" height="100%" fill="url(#portal-bg)"></rect>
    <g id="portal-bars" fill="#111111">
      <path class="portal__bar"></path>
      <path class="portal__bar"></path>
      <path class="portal__bar"></path>
      <path class="portal__bar"></path>
      <path class="portal__bar"></path>
    </g>
  </svg>
</div>
</template>

<main class="scene" id="scene">

  <!-- Tracciati delle orbite: puramente decorativi. Un solo SVG invece di
       quattro elementi: quattro bordi ellittici grandi come lo schermo
       costringono il browser a ridisegnarli a ogni fotogramma. -->
  <svg class="orbits" id="orbits" aria-hidden="true" focusable="false">
    <g id="orbits-g" fill="none" stroke="#111111" stroke-dasharray="6 7">
      <ellipse class="orbit" cx="0" cy="0"></ellipse>
      <ellipse class="orbit" cx="0" cy="0"></ellipse>
      <ellipse class="orbit" cx="0" cy="0"></ellipse>
      <ellipse class="orbit" cx="0" cy="0"></ellipse>
    </g>
  </svg>

  <!-- Loghi e bandiere in orbita.

       Le bandiere sono solo quelle dei luoghi dove stanno questi atenei:
       Milano e la Lombardia (otto), Roma e il Lazio (LUISS e Sapienza), Torino
       e il Piemonte (il Politecnico e l'Università di Torino), Genova
       e la Liguria (UniGe). Le altre regioni e città non c'entravano niente.

       Manca la bandiera di Genova perché è la stessa di Milano — la croce di
       San Giorgio, rossa in campo bianco — e di due copie della stessa
       bandiera se ne tiene una. La Liguria invece resta: la sua bandiera è a
       bande verde, rosso e azzurro con la caravella, non è la croce. -->
  <div class="field" id="field">

    <div class="token token--logo" data-kind="logo" data-h="0.50"><img src="assets/loghi/Polimi.svg" alt="Politecnico di Milano" width="131" height="43" loading="lazy" decoding="async"></div>
    <div class="token token--logo" data-kind="logo" data-h="0.40"><img src="assets/loghi/Bocconi.svg" alt="Università Bocconi" width="188" height="40" loading="lazy" decoding="async"></div>
    <div class="token token--logo" data-kind="logo" data-h="0.62"><img src="assets/loghi/Unimi-positivo.svg" alt="Università degli Studi di Milano — La Statale" width="193" height="113" loading="lazy" decoding="async"></div>
    <div class="token token--logo" data-kind="logo" data-h="0.52"><img src="assets/loghi/Cattolica.svg" alt="Università Cattolica del Sacro Cuore" width="189" height="77" loading="lazy" decoding="async"></div>
    <div class="token token--logo" data-kind="logo" data-h="0.34"><img src="assets/loghi/LUISS-ufficiale.svg" alt="LUISS Guido Carli" width="348" height="64" loading="lazy" decoding="async"></div>
    <div class="token token--logo" data-kind="logo" data-h="0.56"><img src="assets/loghi/Polito.svg" alt="Politecnico di Torino" width="700" height="307" loading="lazy" decoding="async"></div>
    <div class="token token--logo" data-kind="logo" data-h="0.52"><img src="assets/loghi/Unito-nuovo.svg" alt="Università di Torino" width="1335" height="543" loading="lazy" decoding="async"></div>
    <div class="token token--logo" data-kind="logo" data-h="0.44"><img src="assets/loghi/Unige-colore.svg" alt="Università di Genova" width="479" height="121" loading="lazy" decoding="async"></div>
    <div class="token token--logo" data-kind="logo" data-h="0.68"><img src="assets/loghi/Unimib.png" alt="Università degli Studi di Milano-Bicocca" width="160" height="172" loading="lazy" decoding="async"></div>
    <div class="token token--logo" data-kind="logo" data-h="0.30"><img src="assets/loghi/IULM-positivo.png" alt="Università IULM" width="1488" height="228" loading="lazy" decoding="async"></div>
    <div class="token token--logo" data-kind="logo" data-h="0.46"><img src="assets/loghi/La_Sapienza.svg" alt="Sapienza Università di Roma" width="201" height="60" loading="lazy" decoding="async"></div>
    <div class="token token--logo" data-kind="logo" data-h="0.54"><img src="assets/loghi/UniSR.svg" alt="Università Vita-Salute San Raffaele" width="210" height="80" loading="lazy" decoding="async"></div>
    <div class="token token--logo" data-kind="logo" data-h="0.40"><img src="assets/loghi/Hunimed.svg" alt="Humanitas University" width="192" height="40" loading="lazy" decoding="async"></div>

    <div class="token token--flag" data-kind="flag"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Lombardy.svg?width=120" alt="Lombardia" loading="lazy" decoding="async" referrerpolicy="no-referrer"></div>
    <div class="token token--flag" data-kind="flag"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Lazio.svg?width=120" alt="Lazio" loading="lazy" decoding="async" referrerpolicy="no-referrer"></div>
    <div class="token token--flag" data-kind="flag"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Piedmont.svg?width=120" alt="Piemonte" loading="lazy" decoding="async" referrerpolicy="no-referrer"></div>
    <div class="token token--flag" data-kind="flag"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Liguria.svg?width=120" alt="Liguria" loading="lazy" decoding="async" referrerpolicy="no-referrer"></div>

    <div class="token token--flag" data-kind="flag"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Milan.svg?width=120" alt="Milano" loading="lazy" decoding="async" referrerpolicy="no-referrer"></div>
    <div class="token token--flag" data-kind="flag"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Rome.svg?width=120" alt="Roma" loading="lazy" decoding="async" referrerpolicy="no-referrer"></div>
    <div class="token token--flag" data-kind="flag"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Turin.svg?width=120" alt="Torino" loading="lazy" decoding="async" referrerpolicy="no-referrer"></div>

  </div>

  <!-- Velo: nasconde ciò che passa dietro al logo, così niente lo attraversa mai davanti -->
  <div class="veil" id="veil" aria-hidden="true"></div>

  <h1 class="brand" id="brand">
    <img src="assets/img/agora-logo.png" alt="Agorà" width="1385" height="512" fetchpriority="high" decoding="async">
  </h1>

</main>
