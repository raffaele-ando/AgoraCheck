<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!--
      I percorsi partono dalla RADICE, non da "./", ed è la correzione che fa
      ricomparire l'icona. Un href relativo si risolve rispetto all'indirizzo
      della pagina: su /AgoraCheck/dashboard "./favicon.svg" dava
      /AgoraCheck/favicon.svg e funzionava, ma su /AgoraCheck/milano/spotted
      dava /AgoraCheck/milano/favicon.svg, cioè un 404 — ed è esattamente il
      motivo per cui l'icona si vedeva nella Dashboard e non sulla bacheca o
      sulle pagine delle città. In compilazione Vite antepone da sé la base
      del sito ai percorsi che iniziano con "/".
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      L'SVG da solo non basta, ed è il motivo per cui l'icona non compariva.
      Chrome su Android IGNORA le icone SVG del manifest e Safari ignora un
      apple-touch-icon in SVG: entrambi vogliono un PNG. Senza, la scheda di
      condivisione e la schermata home mostrano il mappamondo generico.
      I PNG qui sotto sono generati da icon-maskable.svg con `node scripts/generate-icons.mjs`,
      così il marchio ha una sola fonte.
    -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Il logotipo è la prima cosa che si guarda, quindi si chiede subito, con
      priorità alta: senza, il browser lo scopre solo dopo aver interpretato il
      JavaScript e lo dipinge mentre arriva — l'effetto "a strisce orizzontali".
      Insieme al ridimensionamento (23 kB invece di 123) arriva in un colpo solo.
    -->
    <link rel="preload" as="image" href="/agora-logo.png" fetchpriority="high" />
    <meta name="theme-color" content="#DC5F00" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100e0c" media="(prefers-color-scheme: dark)" />
    <!--
      Apertura anticipata delle connessioni verso i servizi contattati subito
      all'avvio. Senza, il browser esegue DNS e handshake TLS solo quando il
      codice li richiede, cioè dopo aver scaricato e interpretato tutto il
      JavaScript: su rete mobile sono centinaia di millisecondi in serie,
      proprio durante l'accesso.
    -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://apis.google.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      I caratteri si caricano SENZA bloccare il disegno della pagina.

      Un <link rel="stylesheet"> normale è bloccante: il browser non disegna
      nulla finché non lo ha ricevuto. Essendo su un host di terze parti, se
      fonts.googleapis.com è lento o irraggiungibile la pagina resta BIANCA
      per tutto il tempo dell'attesa — misurato qui in 12,5 secondi di
      schermata vuota simulando l'host non raggiungibile. Su rete mobile
      instabile è esattamente il caso che si presenta.

      Il trucco: si dichiara il foglio per il solo mezzo "print", che non
      blocca il disegno; appena è arrivato lo si promuove a "all". La pagina
      compare subito con il carattere di sistema e i caratteri del marchio
      subentrano quando sono pronti (display=swap è già nell'indirizzo).
      Il <noscript> copre chi ha JavaScript disattivato.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@800;900&family=Anton&display=swap"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@800;900&family=Anton&display=swap"
      />
    </noscript>
    <!--
      interactive-widget=resizes-content è la chiave del problema "quando tocco
      un campo devo scorrere per vedere il resto".

      Per difetto la tastiera virtuale su Android NON ridimensiona la pagina:
      si limita a coprirla, sovrapponendosi. Il documento continua a credere di
      essere alto quanto lo schermo intero, quindi 100dvh resta invariato e
      metà interfaccia finisce sotto i tasti — da cui l'obbligo di scorrere per
      raggiungere quello che si voleva toccare.

      Con questo valore la tastiera riduce davvero il viewport: 100dvh diventa
      lo spazio effettivamente visibile e il contenuto si ricompone per entrarci.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Agorà</title>
    <meta name="description" content="Agorà — la bacheca di quartiere: spotted, sondaggi e messaggi della tua zona." />
    <meta property="og:title" content="Agorà" />
    <meta property="og:description" content="La bacheca di quartiere: spotted, sondaggi e messaggi della tua zona." />
    <!--
      Anteprima social: indirizzo ASSOLUTO, come richiedono gli scrapers, e
      servito da noi invece che da raw.githubusercontent (soggetto a limiti di
      frequenza: l'anteprima spariva proprio quando il link girava molto).
    -->
    <meta property="og:image" content="https://raffaele-ando.github.io/AgoraCheck/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Agorà" />
    <meta name="twitter:description" content="La bacheca di quartiere: spotted, sondaggi e messaggi della tua zona." />
    <meta name="twitter:image" content="https://raffaele-ando.github.io/AgoraCheck/icon-512.png" />
  </head>
  <body>
    <!--
      Copertura d'avvio.

      Prima, alla prima visita, si vedeva una rotella di caricamento: brutta e
      soprattutto inutile, perché non dice nulla a chi guarda. Al suo posto c'è
      l'apertura del marchio, la stessa di Agorà Orbite.

      Questo riquadro è QUI e non in React di proposito: deve esistere dal primo
      fotogramma, prima ancora che il JavaScript venga interpretato, altrimenti
      resterebbe scoperto proprio l'istante che si vuole coprire. È inchiostro
      pieno, dello stesso colore del velo del portale, così quando React monta
      l'animazione il passaggio non si vede.

      Chi ha già visto l'apertura in questa scheda, o ha chiesto meno
      animazioni, salta tutto: la classe viene messa subito qui sotto e il
      riquadro non compare affatto.
    -->
    <style>
      #ag-boot {
        position: fixed;
        inset: 0;
        z-index: 90;
        background: #111111;
      }
      html.ag-booted #ag-boot { display: none; }
    </style>
    <script>
      try {
        // Il tasto "indietro" NON è più un caso speciale: si torna e basta.
        //
        // Avevo tenuto la copertura anche sul ritorno, per poterci disegnare
        // sopra l'apertura della porta. Non funziona, e non per come era
        // scritto: premendo indietro il browser mostra per primo il PROPRIO
        // ritratto della pagina di destinazione, che ha già in memoria, e solo
        // dopo lascia spazio al documento vero. Qualunque cosa disegniamo noi
        // arriva per forza dopo quel ritratto — quindi si vedeva la bacheca,
        // poi il nero, poi l'animazione. Non è un difetto di sincronia da
        // aggiustare: è l'ordine imposto dal browser, e contro quello si perde
        // sempre.
        //
        // Indietro significa "torna com'era", e com'era è già sullo schermo:
        // la cosa giusta è arrivarci subito, senza interruzioni.
        if (
          sessionStorage.getItem("agora_intro") === "1" ||
          matchMedia("(prefers-reduced-motion: reduce)").matches
        ) {
          document.documentElement.className += " ag-booted";
        }
      } catch (e) {
        /* archiviazione bloccata: si mostra l'apertura, non è un danno */
      }
    </script>
    <div id="ag-boot"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
