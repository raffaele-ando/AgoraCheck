<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!--
      L'icona puntava a ./logo.png, un file che non esiste in public/: era un
      404, quindi la scheda mostrava l'icona generica del browser finché (e se)
      Firestore non restituiva quella caricata dalle impostazioni.
      Ora c'è un SVG vero, nitido a ogni densità.
    -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <meta name="theme-color" content="#DC5F00" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131110" media="(prefers-color-scheme: dark)" />
    <!--
      Apertura anticipata delle connessioni verso i servizi contattati subito
      all'avvio. Senza, il browser esegue DNS e handshake TLS solo quando il
      codice li richiede, cioè dopo aver scaricato e interpretato tutto il
      JavaScript: su rete mobile sono centinaia di millisecondi in serie,
      proprio durante l'accesso.
    -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://apis.google.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      I caratteri si caricano SENZA bloccare il disegno della pagina.

      Un <link rel="stylesheet"> normale è bloccante: il browser non disegna
      nulla finché non lo ha ricevuto. Essendo su un host di terze parti, se
      fonts.googleapis.com è lento o irraggiungibile la pagina resta BIANCA
      per tutto il tempo dell'attesa — misurato qui in 12,5 secondi di
      schermata vuota simulando l'host non raggiungibile. Su rete mobile
      instabile è esattamente il caso che si presenta.

      Il trucco: si dichiara il foglio per il solo mezzo "print", che non
      blocca il disegno; appena è arrivato lo si promuove a "all". La pagina
      compare subito con il carattere di sistema e i caratteri del marchio
      subentrano quando sono pronti (display=swap è già nell'indirizzo).
      Il <noscript> copre chi ha JavaScript disattivato.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@800;900&family=Anton&display=swap"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@800;900&family=Anton&display=swap"
      />
    </noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Agorà</title>
    <meta name="description" content="Agorà — la bacheca di quartiere: spotted, sondaggi e messaggi della tua zona." />
    <meta property="og:title" content="Agorà" />
    <meta property="og:description" content="La bacheca di quartiere: spotted, sondaggi e messaggi della tua zona." />
    <!--
      Le anteprime social richiedono un indirizzo ASSOLUTO: il precedente
      ./logo.png era sia relativo sia inesistente, quindi ogni link condiviso
      appariva senza immagine.
    -->
    <meta property="og:image" content="https://raw.githubusercontent.com/raffaele-ando/Logo-vari/main/logo.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Agorà" />
    <meta name="twitter:description" content="La bacheca di quartiere: spotted, sondaggi e messaggi della tua zona." />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/raffaele-ando/Logo-vari/main/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
