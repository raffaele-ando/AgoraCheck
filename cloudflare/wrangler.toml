# Cloudflare Worker config for the Agorà edge (identity + media).
# Deploy:  cd cloudflare && npx wrangler deploy
# Secret:  npx wrangler secret put ID_SECRET   (any long random string)
#
# main è worker.ts, non worker.js: Wrangler compila TypeScript da sé con il
# proprio esbuild interno al momento del deploy, quindi non serve alcun passo
# di compilazione a monte per questo file.
name = "agora-edge"
main = "worker.ts"
compatibility_date = "2024-11-01"

# Bind the resources already provisioned in this account:
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "agora-media"

[[kv_namespaces]]
binding = "IDENTITY"
id = "14176b51077746ffb3e9ddc8bcf58e84"   # KV namespace "agora-identity"

# Route SOLO questi tre percorsi, non più tutto il dominio con "/*".
#
# Il dominio agora.theproject.world ora punta (via DNS) direttamente al sito
# AgoraCheck pubblicato su GitHub Pages: quello serve tutte le pagine, e a
# QUESTO Worker restano solo gli endpoint che non hanno equivalente su un sito
# statico — identità del dispositivo e upload dei media. Un percorso non
# coperto da nessuna di queste tre Route non passa mai dal Worker: Cloudflare
# lo instrada direttamente all'origine del record DNS (GitHub Pages), senza
# nemmeno invocare fetch(), quindi il ramo finale di worker.ts ("tutto il
# resto passa all'origine") resta un ripiego difensivo, non il percorso
# normale.
#
# Attivarle: togliere il cancelletto dalle righe sotto e lanciare
# `npx wrangler deploy` da questa cartella. La modalità SSL/TLS della zona
# deve essere "Full" o "Full (strict)" — GitHub Pages serve HTTPS con un
# certificato valido, e "Flexible" darebbe un ciclo di redirect perché GitHub
# forza sempre HTTPS.
[[routes]]
pattern = "agora.theproject.world/id"
zone_name = "theproject.world"

[[routes]]
pattern = "agora.theproject.world/px.gif"
zone_name = "theproject.world"

[[routes]]
pattern = "agora.theproject.world/media"
zone_name = "theproject.world"

[[routes]]
pattern = "agora.theproject.world/media/*"
zone_name = "theproject.world"
